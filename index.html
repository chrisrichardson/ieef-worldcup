<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEEF World Cup 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #1a1a2e;
    }

    /* ── Auth screen ── */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .auth-card h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
    .auth-card p.subtitle { color: #666; margin-bottom: 32px; font-size: 0.95rem; }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #3c4043;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      width: 100%;
      justify-content: center;
    }
    .google-btn:hover { background: #f8f9fa; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .google-btn svg { flex-shrink: 0; }

    .error-msg { color: #d93025; font-size: 0.85rem; margin-top: 16px; min-height: 20px; }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── App shell (post-login) ── */
    #app-screen { display: none; }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-pill img {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }
    .user-pill span { font-size: 0.85rem; opacity: 0.85; }

    .sign-out-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sign-out-btn:hover { background: rgba(255,255,255,0.22); }

    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin: 28px 0 12px;
    }
    .section-title:first-child { margin-top: 0; }

    /* ── Match card ── */
    .match-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      padding: 14px 18px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .team.away { flex-direction: row-reverse; }

    .team img.flag {
      width: 36px;
      height: 24px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .team-name {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team.away .team-name { text-align: right; }

    .match-centre {
      text-align: center;
      flex-shrink: 0;
    }
    .score {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #1a1a2e;
    }
    .match-time {
      font-size: 0.72rem;
      color: #999;
      margin-top: 3px;
      white-space: nowrap;
    }
    .group-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      background: #e8f0fe;
      color: #4285f4;
      border-radius: 4px;
      padding: 2px 6px;
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .loading-matches {
      text-align: center;
      color: #aaa;
      padding: 48px 0;
      font-size: 0.9rem;
    }
    .loading-matches .spinner { margin-bottom: 12px; }
  </style>
</head>
<body>

<!-- ── Auth screen ── -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>IEEF World Cup</h1>
    <p class="subtitle">Sign in to continue</p>

    <div id="loading-view">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>

    <div id="sign-in-view" style="display:none">
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Sign in with Google
      </button>
      <p class="error-msg" id="error-msg"></p>
    </div>
  </div>
</div>

<!-- ── App screen ── -->
<div id="app-screen">
  <header>
    <h1>⚽ IEEF World Cup 2026</h1>
    <div class="user-pill">
      <img id="user-avatar" src="" alt="" />
      <span id="user-name"></span>
      <button class="sign-out-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <main id="matches-container">
    <div class="loading-matches">
      <div class="spinner"></div>
      <p>Loading matches…</p>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup,
    signOut as firebaseSignOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, query, where, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDH43Zx3mq9c3HqFtEa--EHEdCv3xhqaf4",
    authDomain: "ieef-world-cup.firebaseapp.com",
    projectId: "ieef-world-cup",
    storageBucket: "ieef-world-cup.firebasestorage.app",
    messagingSenderId: "194577565271",
    appId: "1:194577565271:web:9deeb5bc190a74e728c512"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // ── Flag CDN helper (flagcdn.com, ISO 3166-1 alpha-2) ──
  const FLAG_CODES = {
    1:"mx", 2:"za", 3:"kr", 4:"cz", 5:"ca", 6:"ba", 7:"qa", 8:"ch",
    9:"br", 10:"ma", 11:"ht", 12:"gb-sct", 13:"us", 14:"py", 15:"au",
    16:"tr", 17:"de", 18:"cw", 19:"ci", 20:"ec", 21:"nl", 22:"jp",
    23:"se", 24:"tn", 25:"be", 26:"eg", 27:"ir", 28:"nz", 29:"es",
    30:"cv", 31:"sa", 32:"uy", 33:"fr", 34:"sn", 35:"iq", 36:"no",
    37:"ar", 38:"dz", 39:"at", 40:"jo", 41:"pt", 42:"cd", 43:"uz",
    44:"co", 45:"gb-eng", 46:"hr", 47:"gh", 48:"pa"
  };

  function flagUrl(teamId) {
    const code = FLAG_CODES[teamId];
    if (!code) return "";
    return `https://flagcdn.com/w40/${code}.png`;
  }

  // ── Auth views ──
  const authScreen  = document.getElementById("auth-screen");
  const appScreen   = document.getElementById("app-screen");
  const loadingView = document.getElementById("loading-view");
  const signInView  = document.getElementById("sign-in-view");

  function showAuth(view) {
    [loadingView, signInView].forEach(v => v.style.display = "none");
    view.style.display = "block";
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      authScreen.style.display = "none";
      appScreen.style.display  = "block";

      document.getElementById("user-name").textContent = user.displayName || user.email;
      const avatar = document.getElementById("user-avatar");
      if (user.photoURL) { avatar.src = user.photoURL; avatar.style.display = "block"; }

      await loadMatches();
    } else {
      authScreen.style.display = "flex";
      appScreen.style.display  = "none";
      showAuth(signInView);
    }
  });

  window.signInWithGoogle = async () => {
    document.getElementById("error-msg").textContent = "";
    showAuth(loadingView);
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      showAuth(signInView);
      if (err.code !== "auth/popup-closed-by-user") {
        document.getElementById("error-msg").textContent = "Sign-in failed: " + err.message;
      }
    }
  };

  window.signOut = async () => { await firebaseSignOut(auth); };

  // ── Load and render matches ──
  async function loadMatches() {
    const container = document.getElementById("matches-container");

    // Fetch teams
    const teamsSnap = await getDocs(collection(db, "teams"));
    const teams = {};
    teamsSnap.forEach(doc => { teams[doc.data().id] = doc.data(); });

    // Fetch group-stage matches (hteam != null), ordered by date
    const matchesSnap = await getDocs(
      query(collection(db, "matches"), where("mult", "==", 1), orderBy("date"))
    );

    const matches = [];
    matchesSnap.forEach(doc => matches.push(doc.data()));

    // Group by date (local date string)
    const byDate = {};
    for (const m of matches) {
      const d = m.date.toDate();
      const label = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
      if (!byDate[label]) byDate[label] = [];
      byDate[label].push({ ...m, dateObj: d });
    }

    // Render
    let html = "";
    for (const [dateLabel, dayMatches] of Object.entries(byDate)) {
      html += `<div class="section-title">${dateLabel}</div>`;
      for (const m of dayMatches) {
        const ht = teams[m.hteam] || {};
        const at = teams[m.ateam] || {};
        const timeStr = m.dateObj.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        const score = (m.hscore != null && m.ascore != null)
          ? `<span class="score">${m.hscore} – ${m.ascore}</span>`
          : `<span class="score" style="color:#bbb">vs</span>`;

        html += `
          <div class="match-card">
            <div class="team home">
              <img class="flag" src="${flagUrl(m.hteam)}" alt="${ht.name || ''}" />
              <span class="team-name">${ht.name || "TBD"}</span>
            </div>
            <div class="match-centre">
              ${score}
              <div class="match-time">${timeStr}</div>
              <div class="group-badge">Group ${m.group}</div>
            </div>
            <div class="team away">
              <img class="flag" src="${flagUrl(m.ateam)}" alt="${at.name || ''}" />
              <span class="team-name">${at.name || "TBD"}</span>
            </div>
          </div>`;
      }
    }

    container.innerHTML = html || "<p style='color:#aaa;padding:32px 0;text-align:center'>No matches found.</p>";
  }
</script>

</body>
</html>
