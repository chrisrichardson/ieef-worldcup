<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEEF World Cup 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #1a1a2e;
    }

    /* ── Auth screen ── */
    #auth-screen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px; width: 100%; max-width: 420px; text-align: center;
    }
    .auth-card h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
    .auth-card p.subtitle { color: #666; margin-bottom: 32px; font-size: 0.95rem; }
    .google-btn {
      display: inline-flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid #dadce0; border-radius: 8px;
      padding: 12px 24px; font-size: 0.95rem; font-weight: 500; color: #3c4043;
      cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
      width: 100%; justify-content: center;
    }
    .google-btn:hover { background: #f8f9fa; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .google-btn svg { flex-shrink: 0; }
    .error-msg { color: #d93025; font-size: 0.85rem; margin-top: 16px; min-height: 20px; }

    /* ── App shell ── */
    #app-screen { display: none; }

    header {
      background: #1a1a2e; color: #fff;
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-pill { display: flex; align-items: center; gap: 8px; }
    .user-pill img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; display: none; }
    .user-pill span { font-size: 0.82rem; opacity: 0.8; }
    .sign-out-btn {
      background: rgba(255,255,255,0.12); border: none; border-radius: 6px;
      padding: 5px 12px; font-size: 0.78rem; font-weight: 500; color: #fff;
      cursor: pointer; transition: background 0.15s;
    }
    .sign-out-btn:hover { background: rgba(255,255,255,0.22); }

    /* ── Tabs ── */
    .tab-bar {
      background: #fff; border-bottom: 1px solid #e8e8e8;
      display: flex; padding: 0 16px;
    }
    .tab-btn {
      padding: 12px 20px; font-size: 0.88rem; font-weight: 600;
      color: #888; border: none; background: none; cursor: pointer;
      border-bottom: 3px solid transparent; margin-bottom: -1px;
      transition: color 0.15s;
    }
    .tab-btn.active { color: #1a1a2e; border-bottom-color: #4285f4; }
    .tab-btn:hover:not(.active) { color: #555; }

    /* ── Tally bar (matches tab) ── */
    .tally-bar {
      background: #fff; border-bottom: 1px solid #f0f0f0;
      padding: 8px 24px; display: flex; align-items: center; gap: 20px;
      font-size: 0.82rem; color: #666;
    }
    .tally-bar strong { font-size: 1rem; font-weight: 700; color: #1a1a2e; }
    .save-status { margin-left: auto; font-size: 0.78rem; color: #34a853; min-width: 60px; text-align: right; }

    /* ── Tab panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    main { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }

    .section-title {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #999; margin: 24px 0 10px;
    }
    .section-title:first-child { margin-top: 0; }

    /* ── Match card ── */
    .match-card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 12px 16px; margin-bottom: 7px;
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px;
    }
    .match-card.locked { background: #fafafa; }
    .match-card.has-result { border-left: 3px solid #e8f0fe; }
    .match-card.scored-2 { border-left: 3px solid #34a853; }
    .match-card.scored-1 { border-left: 3px solid #fbbc05; }

    .team { display: flex; align-items: center; gap: 8px; }
    .team.away { flex-direction: row-reverse; }
    .team img.flag {
      width: 34px; height: 22px; object-fit: cover;
      border-radius: 3px; border: 1px solid #e8e8e8; flex-shrink: 0;
    }
    .team-name {
      font-size: 0.88rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
    }
    .team.away .team-name { text-align: right; }

    .match-centre { text-align: center; flex-shrink: 0; min-width: 90px; }

    .score-inputs { display: flex; align-items: center; gap: 5px; justify-content: center; }
    .score-inputs input {
      width: 38px; height: 38px; border: 2px solid #dadce0; border-radius: 8px;
      text-align: center; font-size: 1.1rem; font-weight: 700; color: #1a1a2e; background: #fff;
      -moz-appearance: textfield;
    }
    .score-inputs input::-webkit-outer-spin-button,
    .score-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .score-inputs input:focus { outline: none; border-color: #4285f4; }
    .score-inputs input.has-value { border-color: #4285f4; background: #e8f0fe; }
    .score-sep { font-size: 1.1rem; font-weight: 700; color: #aaa; }

    .actual-score { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.04em; }
    .actual-score.pending { color: #bbb; }

    .pred-row {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-top: 3px; flex-wrap: wrap;
    }
    .pred-tag { font-size: 0.72rem; color: #888; background: #f0f2f5; border-radius: 4px; padding: 2px 6px; }
    .pts-tag { font-size: 0.72rem; font-weight: 700; border-radius: 4px; padding: 2px 6px; }
    .pts-tag.pts-2 { background: #e6f4ea; color: #188038; }
    .pts-tag.pts-1 { background: #fef7e0; color: #b06000; }
    .pts-tag.pts-0 { background: #f0f0f0; color: #999; }

    .match-meta { margin-top: 4px; }
    .match-time { font-size: 0.7rem; color: #bbb; }
    .group-badge {
      display: inline-block; font-size: 0.62rem; font-weight: 700;
      background: #e8f0fe; color: #4285f4; border-radius: 4px; padding: 1px 5px; margin-top: 2px;
    }
    .lock-icon { font-size: 0.65rem; color: #ccc; }

    /* ── League table ── */
    .league-table {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .league-table table { width: 100%; border-collapse: collapse; }
    .league-table th {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #999; background: #fafafa;
      padding: 10px 16px; text-align: left; border-bottom: 1px solid #f0f0f0;
    }
    .league-table th.num { text-align: right; }
    .league-table td { padding: 11px 16px; border-bottom: 1px solid #f7f7f7; font-size: 0.88rem; }
    .league-table tr:last-child td { border-bottom: none; }
    .league-table tr.me td { background: #f0f7ff; }
    .league-table td.num { text-align: right; font-weight: 600; }
    .league-table td.pts { font-size: 1rem; font-weight: 800; color: #1a1a2e; text-align: right; }
    .rank { font-weight: 700; color: #aaa; width: 28px; }
    .rank.top1 { color: #f4b400; }
    .rank.top2 { color: #9e9e9e; }
    .rank.top3 { color: #bf7d3a; }

    .player-cell { display: flex; align-items: center; gap: 10px; }
    .player-cell img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .player-cell .avatar-placeholder {
      width: 28px; height: 28px; border-radius: 50%; background: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; color: #888; flex-shrink: 0;
    }

    /* Spinner */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e0e0e0; border-top-color: #4285f4;
      border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-block { text-align: center; color: #aaa; padding: 48px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- ── Auth screen ── -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>IEEF World Cup</h1>
    <p class="subtitle">Sign in to continue</p>
    <div id="loading-view"><div class="spinner"></div><p>Loading…</p></div>
    <div id="sign-in-view" style="display:none">
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Sign in with Google
      </button>
      <p class="error-msg" id="error-msg"></p>
    </div>
  </div>
</div>

<!-- ── App screen ── -->
<div id="app-screen">
  <header>
    <h1>⚽ IEEF World Cup 2026</h1>
    <div class="header-right">
      <div class="user-pill">
        <img id="user-avatar" src="" alt="" />
        <span id="user-name"></span>
      </div>
      <button class="sign-out-btn" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('matches')">Matches</button>
    <button class="tab-btn" onclick="switchTab('league')">League Table</button>
  </div>

  <!-- Matches tab -->
  <div id="tab-matches" class="tab-panel active">
    <div class="tally-bar">
      <div>My score: <strong id="total-pts">—</strong></div>
      <div>Predicted: <strong id="pred-count">—</strong></div>
      <div>Correct: <strong id="correct-count">—</strong></div>
      <div class="save-status" id="save-status"></div>
    </div>
    <main id="matches-container">
      <div class="loading-block"><div class="spinner"></div><p>Loading matches…</p></div>
    </main>
  </div>

  <!-- League tab -->
  <div id="tab-league" class="tab-panel">
    <main id="league-container">
      <div class="loading-block"><div class="spinner"></div><p>Loading league table…</p></div>
    </main>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup,
    signOut as firebaseSignOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, setDoc, doc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDH43Zx3mq9c3HqFtEa--EHEdCv3xhqaf4",
    authDomain: "ieef-world-cup.firebaseapp.com",
    projectId: "ieef-world-cup",
    storageBucket: "ieef-world-cup.firebasestorage.app",
    messagingSenderId: "194577565271",
    appId: "1:194577565271:web:9deeb5bc190a74e728c512"
  };

  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const db       = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // ── Flag CDN ──
  const FLAG_CODES = {
    1:"mx",2:"za",3:"kr",4:"cz",5:"ca",6:"ba",7:"qa",8:"ch",
    9:"br",10:"ma",11:"ht",12:"gb-sct",13:"us",14:"py",15:"au",
    16:"tr",17:"de",18:"cw",19:"ci",20:"ec",21:"nl",22:"jp",
    23:"se",24:"tn",25:"be",26:"eg",27:"ir",28:"nz",29:"es",
    30:"cv",31:"sa",32:"uy",33:"fr",34:"sn",35:"iq",36:"no",
    37:"ar",38:"dz",39:"at",40:"jo",41:"pt",42:"cd",43:"uz",
    44:"co",45:"gb-eng",46:"hr",47:"gh",48:"pa"
  };
  const flagUrl = id => `https://flagcdn.com/w40/${FLAG_CODES[id] || 'un'}.png`;

  // ── Scoring ──
  function calcPoints(hActual, aActual, hGuess, aGuess, mult) {
    if (hActual == null || aActual == null || hGuess === "" || hGuess === undefined || aGuess === "" || aGuess === undefined) return null;
    const h = parseInt(hActual), a = parseInt(aActual);
    const gh = parseInt(hGuess),  ga = parseInt(aGuess);
    if (isNaN(gh) || isNaN(ga)) return null;
    let pts = 0;
    if ((h > a && gh > ga) || (h < a && gh < ga) || (h === a && gh === ga)) pts = 1;
    if (gh === h && ga === a) pts++;
    return pts * mult;
  }

  // ── State ──
  let currentUser  = null;
  let predictions  = {};
  let cachedMatches = [];
  let cachedTeams   = {};
  let saveTimer    = null;
  let pendingSaves = {};

  // ── Tab switching ──
  window.switchTab = (tab) => {
    document.querySelectorAll(".tab-btn").forEach((b, i) => {
      b.classList.toggle("active", (i === 0 && tab === "matches") || (i === 1 && tab === "league"));
    });
    document.getElementById("tab-matches").classList.toggle("active", tab === "matches");
    document.getElementById("tab-league").classList.toggle("active", tab === "league");
    if (tab === "league") renderLeague();
  };

  // ── Auth ──
  const authScreen  = document.getElementById("auth-screen");
  const appScreen   = document.getElementById("app-screen");
  const loadingView = document.getElementById("loading-view");
  const signInView  = document.getElementById("sign-in-view");

  function showAuthView(v) {
    [loadingView, signInView].forEach(x => x.style.display = "none");
    v.style.display = "block";
  }

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      authScreen.style.display = "none";
      appScreen.style.display  = "block";
      document.getElementById("user-name").textContent = user.displayName || user.email;
      const av = document.getElementById("user-avatar");
      if (user.photoURL) { av.src = user.photoURL; av.style.display = "block"; }

      // Register user in leaderboard with their display info
      await setDoc(doc(db, "leaderboard", user.uid), {
        name:     user.displayName || user.email,
        photoURL: user.photoURL || null,
        pts:      0, predCount: 0, correctCount: 0
      }, { merge: true });

      await loadAll();
    } else {
      currentUser = null;
      authScreen.style.display = "flex";
      appScreen.style.display  = "none";
      showAuthView(signInView);
    }
  });

  window.signInWithGoogle = async () => {
    document.getElementById("error-msg").textContent = "";
    showAuthView(loadingView);
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      showAuthView(signInView);
      if (err.code !== "auth/popup-closed-by-user")
        document.getElementById("error-msg").textContent = "Sign-in failed: " + err.message;
    }
  };
  window.signOut = () => firebaseSignOut(auth);

  // ── Load everything ──
  async function loadAll() {
    // Teams
    const teamsSnap = await getDocs(collection(db, "teams"));
    cachedTeams = {};
    teamsSnap.forEach(d => { cachedTeams[d.data().id] = d.data(); });

    // Matches (group stage only)
    const matchesSnap = await getDocs(collection(db, "matches"));
    const all = [];
    matchesSnap.forEach(d => all.push(d.data()));
    cachedMatches = all
      .filter(m => m.mult === 1 && m.hteam != null)
      .sort((a, b) => a.date.toMillis() - b.date.toMillis());

    // User predictions
    const predSnap = await getDocs(collection(db, "predictions", currentUser.uid, "matches"));
    predictions = {};
    predSnap.forEach(d => { predictions[d.id] = d.data(); });

    renderMatches();
    updateLeaderboardEntry();
  }

  // ── Render matches ──
  function renderMatches() {
    const now = new Date();
    const container = document.getElementById("matches-container");
    let html = "";
    let totalPts = 0, predCount = 0, correctCount = 0;
    const byDate = {};

    for (const m of cachedMatches) {
      const d = m.date.toDate();
      const label = d.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" });
      if (!byDate[label]) byDate[label] = [];
      byDate[label].push({ ...m, dateObj: d });
    }

    for (const [dateLabel, dayMatches] of Object.entries(byDate)) {
      html += `<div class="section-title">${dateLabel}</div>`;
      for (const m of dayMatches) {
        const ht = cachedTeams[m.hteam] || {};
        const at = cachedTeams[m.ateam] || {};
        const locked  = m.dateObj <= now;
        const pred    = predictions[m.id] || {};
        const hGuess  = pred.h !== undefined ? pred.h : "";
        const aGuess  = pred.a !== undefined ? pred.a : "";
        const hActual = m.hscore != null ? String(m.hscore).replace("*","") : null;
        const aActual = m.ascore != null ? String(m.ascore).replace("*","") : null;
        const hasResult = hActual != null && aActual != null;
        const pts = hasResult ? calcPoints(hActual, aActual, hGuess, aGuess, m.mult) : null;
        const timeStr = m.dateObj.toLocaleTimeString("en-GB", {hour:"2-digit",minute:"2-digit"});

        if (hGuess !== "") predCount++;
        if (pts !== null) { totalPts += pts; if (pts > 0) correctCount++; }

        let cardClass = "match-card" + (locked ? " locked" : "");
        if (hasResult) {
          if (pts >= 2 * m.mult)   cardClass += " scored-2";
          else if (pts > 0)        cardClass += " scored-1";
          else                     cardClass += " has-result";
        }

        let centre = "";
        if (!locked) {
          centre = `
            <div class="score-inputs">
              <input type="number" min="0" max="20"
                class="pred-input${hGuess !== "" ? " has-value" : ""}"
                data-mid="${m.id}" data-side="h" value="${hGuess}" placeholder="–" />
              <span class="score-sep">–</span>
              <input type="number" min="0" max="20"
                class="pred-input${aGuess !== "" ? " has-value" : ""}"
                data-mid="${m.id}" data-side="a" value="${aGuess}" placeholder="–" />
            </div>`;
        } else if (hasResult) {
          const predStr = (hGuess !== "" && aGuess !== "") ? `${hGuess}–${aGuess}` : "no prediction";
          const ptsClass = pts >= 2 * m.mult ? "pts-2" : pts > 0 ? "pts-1" : "pts-0";
          centre = `
            <div class="actual-score">${m.hscore} – ${m.ascore}</div>
            <div class="pred-row">
              <span class="pred-tag">You: ${predStr}</span>
              ${pts !== null ? `<span class="pts-tag ${ptsClass}">+${pts}pt${pts!==1?"s":""}</span>` : ""}
            </div>`;
        } else {
          const predStr = (hGuess !== "" && aGuess !== "") ? `${hGuess}–${aGuess}` : "–";
          centre = `
            <div class="actual-score pending">? – ?</div>
            <div class="pred-row">
              <span class="pred-tag">You: ${predStr}</span>
              <span class="lock-icon">🔒</span>
            </div>`;
        }

        html += `
          <div class="${cardClass}">
            <div class="team home">
              <img class="flag" src="${flagUrl(m.hteam)}" alt="${ht.name||""}" />
              <span class="team-name">${ht.name||"TBD"}</span>
            </div>
            <div class="match-centre">
              ${centre}
              <div class="match-meta">
                <div class="match-time">${timeStr}</div>
                <div class="group-badge">Group ${m.group}</div>
              </div>
            </div>
            <div class="team away">
              <img class="flag" src="${flagUrl(m.ateam)}" alt="${at.name||""}" />
              <span class="team-name">${at.name||"TBD"}</span>
            </div>
          </div>`;
      }
    }

    container.innerHTML = html || "<p style='color:#aaa;padding:32px;text-align:center'>No matches found.</p>";
    document.getElementById("total-pts").textContent   = totalPts;
    document.getElementById("pred-count").textContent  = predCount;
    document.getElementById("correct-count").textContent = correctCount;

    container.querySelectorAll(".pred-input").forEach(input => {
      input.addEventListener("input", onPredInput);
    });
  }

  // ── Update leaderboard entry for current user ──
  async function updateLeaderboardEntry() {
    const now = new Date();
    let totalPts = 0, predCount = 0, correctCount = 0;
    for (const m of cachedMatches) {
      if (m.dateObj && m.dateObj > now) continue; // skip future matches
      const hActual = m.hscore != null ? String(m.hscore).replace("*","") : null;
      const aActual = m.ascore != null ? String(m.ascore).replace("*","") : null;
      const pred = predictions[m.id] || {};
      const hGuess = pred.h !== undefined ? pred.h : "";
      const aGuess = pred.a !== undefined ? pred.a : "";
      if (hGuess !== "") predCount++;
      const pts = calcPoints(hActual, aActual, hGuess, aGuess, m.mult);
      if (pts !== null) { totalPts += pts; if (pts > 0) correctCount++; }
    }
    await setDoc(doc(db, "leaderboard", currentUser.uid), {
      pts: totalPts, predCount, correctCount
    }, { merge: true });
  }

  // ── Render league table ──
  async function renderLeague() {
    const container = document.getElementById("league-container");
    container.innerHTML = `<div class="loading-block"><div class="spinner"></div><p>Loading…</p></div>`;

    const snap = await getDocs(collection(db, "leaderboard"));
    const rows = [];
    snap.forEach(d => rows.push({ uid: d.id, ...d.data() }));
    rows.sort((a, b) => (b.pts || 0) - (a.pts || 0));

    const rankClass = (i) => i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "";
    const medal = (i) => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1;

    let html = `
      <div class="league-table">
        <table>
          <thead>
            <tr>
              <th style="width:36px">#</th>
              <th>Player</th>
              <th class="num">Predicted</th>
              <th class="num">Correct</th>
              <th class="num">Points</th>
            </tr>
          </thead>
          <tbody>`;

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      const isMe = r.uid === currentUser.uid;
      const avatar = r.photoURL
        ? `<img src="${r.photoURL}" alt="" />`
        : `<div class="avatar-placeholder">👤</div>`;
      html += `
        <tr${isMe ? ' class="me"' : ''}>
          <td class="rank ${rankClass(i)}">${medal(i)}</td>
          <td><div class="player-cell">${avatar}<span>${r.name || "Unknown"}</span></div></td>
          <td class="num">${r.predCount || 0}</td>
          <td class="num">${r.correctCount || 0}</td>
          <td class="pts">${r.pts || 0}</td>
        </tr>`;
    }

    html += `</tbody></table></div>`;
    container.innerHTML = html;
  }

  // ── Input handling ──
  function onPredInput(e) {
    const mid  = e.target.dataset.mid;
    const side = e.target.dataset.side;
    const val  = e.target.value.trim();

    if (!predictions[mid]) predictions[mid] = {};
    if (val === "") delete predictions[mid][side];
    else predictions[mid][side] = parseInt(val);
    pendingSaves[mid] = { ...predictions[mid] };

    e.target.classList.toggle("has-value", val !== "");
    clearTimeout(saveTimer);
    showSaveStatus("Saving…", "#aaa");
    saveTimer = setTimeout(savePredictions, 600);
  }

  async function savePredictions() {
    const toSave = { ...pendingSaves };
    pendingSaves = {};
    try {
      await Promise.all(
        Object.entries(toSave).map(([mid, pred]) =>
          setDoc(doc(db, "predictions", currentUser.uid, "matches", mid), pred)
        )
      );
      await updateLeaderboardEntry();
      showSaveStatus("Saved ✓", "#34a853");
      setTimeout(() => showSaveStatus("", "#34a853"), 2000);
    } catch (err) {
      showSaveStatus("Save failed ✗", "#d93025");
    }
  }

  function showSaveStatus(msg, color) {
    const el = document.getElementById("save-status");
    el.textContent = msg;
    el.style.color = color;
  }
</script>

</body>
</html>
